name: Update Top 2000 list

# Every day from 10 to 31 December: look for the new NPO Radio 2 Top 2000 list,
# fill in YouTube/Spotify links (scripts/update-top2000.ts) and publish it as the
# new default list. Runs after the list is complete do nothing.
on:
  schedule:
    - cron: "0 7 10-31 12 *" # 07:00 UTC = 08:00 Dutch time
  workflow_dispatch:
    inputs:
      year:
        description: "Edition (year) to import; empty = this year"
        required: false
      source_url:
        description: "Optional: URL of the list's Excel/CSV download, if it is not found automatically"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: update-top2000

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Excel reader
        run: npm install --no-save --no-audit --no-fund exceljs@4.4.0

      - name: Update the Top 2000 list
        id: update
        env:
          YEAR: ${{ inputs.year }}
          SOURCE_URL: ${{ inputs.source_url }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # Fail (and send GitHub's failure e-mail) when the list is still missing
          # from 20 December on, or when someone started the run by hand.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%d)" -ge 20 ]; then
            export FAIL_IF_NOT_FOUND=true
          fi
          npx tsx scripts/update-top2000.ts

      - name: Commit the new list
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A shared/embedded-songs server/songcsv
          git commit -m "Update Top 2000 list"
          git push

      # Pushes made by this workflow do not start other workflows, so start the
      # website publish explicitly.
      - name: Republish the website
        if: steps.update.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
